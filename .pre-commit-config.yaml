exclude: '(^|/)(\.claude|\.codex|\.agents|\.venv|venv|node_modules|\.next|\.turbo|runtime-data|runtime-logs|htmlcov|build|dist|out)/'

repos:
  # Ruff - Python linter ve formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Genel kontroller
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
