[project]
name = "otonom-analiz"
version = "1.0.0"
description = "7/24 Finansal Analiz ve Sinyal Botu - BIST & Kripto"
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Otonom Analiz Team"}
]
keywords = ["trading", "bist", "crypto", "signals", "technical-analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    ".claude",
    ".codex",
    ".agents",
    "venv",
    ".venv",
    "node_modules",
    ".next",
    ".turbo",
    "out",
    "build",
    "dist",
    "runtime-data",
    "runtime-logs",
    "htmlcov",
]
# Explicit paths from pre-commit/CLI must obey the same workspace boundaries.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (pydantic needs this)
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["config", "settings", "database", "signals", "signal_repository"]

[tool.coverage.run]
source = ["."]
omit = ["conftest.py", "tests/*", "middleware/tests/*", "venv/*", ".venv/*", ".claude/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
