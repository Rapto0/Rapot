name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==================== LINT & FORMAT ====================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock

      - name: Install linting tools
        run: python -m pip install -r requirements-dev.lock

      - name: Ensure SQLite artifacts are not tracked
        run: |
          TRACKED_DB_FILES=$(git ls-files '*.db' '*.db-shm' '*.db-wal' '*.sqlite3')
          if [ -n "$TRACKED_DB_FILES" ]; then
            echo "Tracked SQLite files detected:"
            echo "$TRACKED_DB_FILES"
            exit 1
          fi

      # Full tracked-source scope includes middleware and all Python tests.
      # Workspace/generated exclusions are shared with pyproject.toml.
      - name: Run Ruff lint and format checks on all tracked Python files
        run: python -m scripts.ci_quality lint

  # ==================== TEST ====================
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run all backend and middleware tests
        run: python -m pytest tests middleware/tests -v --cov=. --cov-report=xml

  # ==================== FRONTEND ====================
  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the supported npm major
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --no-cache

      - name: Check TypeScript
        run: npm run typecheck -- --incremental false

      - name: Test frontend authentication and proxy URL behavior
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify standalone HTTP and WebSocket proxies with local mocks
        timeout-minutes: 3
        run: npm run test:standalone

  # ==================== SECURITY SCAN ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version

      # CI-only tools; application dependencies and the lock are not modified.
      - name: Install pinned security tools
        run: python -m pip install bandit==1.9.4 pip-audit==2.10.1 packaging==26.0

      # Findings remain explicitly report-only while the initial debt is reviewed.
      # Setup/tool errors, invalid JSON, skipped inputs and incomplete scans fail.
      - name: Scan tracked sources and exact active Python dependency pins
        timeout-minutes: 7
        run: python -m scripts.ci_quality security

      - name: Preserve security reports and coverage manifests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: python-security-${{ github.sha }}
          path: security-reports/
          if-no-files-found: error
          retention-days: 14

  # ==================== DOCKER BUILD ====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: otonom-analiz:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check backend imports without external services
        run: |
          docker run --rm --network none \
            -e TELEGRAM_TOKEN=ci-test-token -e TELEGRAM_CHAT_ID=ci-test-chat \
            -e APP_ENV=test -e AI_ENABLED=0 -e RUN_EMBEDDED_BOT=false \
            -e JWT_SECRET_KEY=ci-only-secret-not-used-for-real-sessions \
            -e DATABASE_PATH=/tmp/trading.sqlite3 -e CACHE_DATABASE_PATH=/tmp/cache.sqlite3 \
            -e MW_WEBHOOK_AUTH_TOKEN=ci-test-webhook \
            otonom-analiz:${{ github.sha }} \
            python -c "import ai_evaluation; import infrastructure.compat.wrapper_telemetry; import api.main; import middleware.api.main"

      - name: Verify signal feed across processes without a network
        timeout-minutes: 2
        run: |
          docker run --rm --network none \
            otonom-analiz:${{ github.sha }} python -m scripts.smoke_signal_feed

      - name: Verify fresh PostgreSQL migration and middleware startup
        shell: bash
        run: |
          set -euo pipefail
          docker network create rapot-ci
          trap 'docker rm -f rapot-ci-middleware rapot-ci-postgres >/dev/null 2>&1 || true; docker network rm rapot-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name rapot-ci-postgres --network rapot-ci \
            -e POSTGRES_USER=rapot_middleware -e POSTGRES_DB=rapot_middleware \
            -e POSTGRES_PASSWORD=ci-only-password postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec rapot-ci-postgres pg_isready -h 127.0.0.1 -U rapot_middleware -d rapot_middleware; then break; fi
            sleep 2
          done
          docker exec rapot-ci-postgres pg_isready -h 127.0.0.1 -U rapot_middleware -d rapot_middleware
          middleware_env=(
            -e MW_APP_ENV=production -e MW_EXECUTION_MODE=DRY_RUN
            -e MW_TRADING_ENABLED=false -e MW_BINANCE_LIVE_ENABLED=false
            -e MW_WEBHOOK_AUTH_TOKEN=ci-only-webhook -e MW_ADMIN_AUTH_TOKEN=ci-only-admin
            -e MW_INVENTORY_ACCOUNT_ID=ci-simulation
            -e MW_DATABASE_URL=postgresql+psycopg://rapot_middleware:ci-only-password@rapot-ci-postgres:5432/rapot_middleware
          )
          docker run --rm --network rapot-ci "${middleware_env[@]}" \
            otonom-analiz:${{ github.sha }} python -m scripts.runtime migrate-middleware
          docker run -d --name rapot-ci-middleware --network rapot-ci "${middleware_env[@]}" \
            otonom-analiz:${{ github.sha }} python -m scripts.runtime middleware
          health_check="import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)); assert data['status']=='ok' and data['execution_mode']=='DRY_RUN' and data['trading_enabled'] is False"
          for attempt in $(seq 1 30); do
            if docker exec rapot-ci-middleware python -c "$health_check"; then break; fi
            sleep 2
          done
          docker logs rapot-ci-middleware
          docker exec rapot-ci-middleware python -c "$health_check"

      - name: Build frontend standalone image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          load: true
          tags: rapot-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Verify frontend container starts and serves standalone assets
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f rapot-ci-frontend >/dev/null 2>&1 || true' EXIT
          docker run -d --name rapot-ci-frontend --network none rapot-frontend:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if docker exec rapot-ci-frontend node -e "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(3000)}).then(async r => {await r.arrayBuffer(); if (!r.ok) process.exitCode = 1;}).catch(() => {process.exitCode = 1;})"; then break; fi
            sleep 2
          done
          docker logs rapot-ci-frontend
          docker exec -i rapot-ci-frontend node <<'JS'
          const assert = require('node:assert/strict');
          (async () => {
            const origin = 'http://127.0.0.1:3000';
            const page = await fetch(origin, {signal: AbortSignal.timeout(3000)});
            assert.equal(page.status, 200);
            const html = await page.text();
            const asset = html.match(/src="(\/_next\/static\/[^" ]+\.js)"/);
            assert.ok(asset, 'Expected a standalone script asset');
            const script = await fetch(origin + asset[1], {signal: AbortSignal.timeout(3000)});
            assert.equal(script.status, 200);
            assert.ok((await script.arrayBuffer()).byteLength > 0);
            console.log('Frontend container HTML and static asset checks passed.');
          })().catch(error => {console.error(error); process.exitCode = 1;});
          JS
