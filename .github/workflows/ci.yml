name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ==================== LINT & FORMAT ====================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock

      - name: Install linting tools
        run: python -m pip install -r requirements-dev.lock

      - name: Ensure SQLite artifacts are not tracked
        run: |
          TRACKED_DB_FILES=$(git ls-files '*.db' '*.db-shm' '*.db-wal' '*.sqlite3')
          if [ -n "$TRACKED_DB_FILES" ]; then
            echo "Tracked SQLite files detected:"
            echo "$TRACKED_DB_FILES"
            exit 1
          fi

      # Keep the changed-file lint policy until the existing P2-3 lint debt is resolved.
      # Test selection below is always the complete backend and middleware suite.
      - name: Run Ruff lint and format checks on changed Python files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          has_base = bool(base and set(base) != {"0"}) and subprocess.run(
              ["git", "cat-file", "-e", f"{base}^{{commit}}"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 0
          if has_base:
              revisions = (
                  [f"{base}...{head}"]
                  if os.environ["EVENT_NAME"] == "pull_request"
                  else [base, head]
              )
              command = ["git", "diff", "--name-only", "--diff-filter=ACMRT", "-z", *revisions]
          else:
              print("No previous commit available; checking all tracked Python files.")
              command = ["git", "ls-files", "-z"]
          paths = subprocess.check_output(command).decode().split("\0")
          files = [path for path in paths if path.endswith((".py", ".pyi"))]
          if not files:
              print("No changed Python files detected; lint skipped.")
              sys.exit(0)
          subprocess.run(
              [sys.executable, "-m", "ruff", "check", "--output-format=github", "--", *files],
              check=True,
          )
          subprocess.run(
              [sys.executable, "-m", "ruff", "format", "--check", "--diff", "--", *files],
              check=True,
          )
          PY

  # ==================== TEST ====================
  test:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-dev.lock

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run all backend and middleware tests
        run: python -m pytest tests middleware/tests -v --cov=. --cov-report=xml

  # ==================== FRONTEND ====================
  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the supported npm major
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"

      - name: Install locked dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --no-cache

      - name: Check TypeScript
        run: npm run typecheck -- --incremental false

      - name: Test frontend authentication and proxy URL behavior
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify standalone HTTP and WebSocket proxies with local mocks
        timeout-minutes: 3
        run: npm run test:standalone

  # ==================== SECURITY SCAN ====================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install security tools
        run: pip install bandit safety

      - name: Run Bandit (security linting)
        run: bandit -r . -x ./venv,./tests -f json -o bandit-report.json || true

      - name: Check dependencies for vulnerabilities
        run: safety check -r requirements.txt || true

  # ==================== DOCKER BUILD ====================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: otonom-analiz:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check backend imports without external services
        run: |
          docker run --rm --network none \
            -e TELEGRAM_TOKEN=ci-test-token -e TELEGRAM_CHAT_ID=ci-test-chat \
            -e APP_ENV=test -e AI_ENABLED=0 -e RUN_EMBEDDED_BOT=false \
            -e DATABASE_PATH=/tmp/trading.sqlite3 -e CACHE_DATABASE_PATH=/tmp/cache.sqlite3 \
            -e MW_WEBHOOK_AUTH_TOKEN=ci-test-webhook \
            otonom-analiz:${{ github.sha }} \
            python -c "import ai_evaluation; import infrastructure.compat.wrapper_telemetry; import api.main; import middleware.api.main"

      - name: Verify fresh PostgreSQL migration and middleware startup
        shell: bash
        run: |
          set -euo pipefail
          docker network create rapot-ci
          trap 'docker rm -f rapot-ci-middleware rapot-ci-postgres >/dev/null 2>&1 || true; docker network rm rapot-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name rapot-ci-postgres --network rapot-ci \
            -e POSTGRES_USER=rapot_middleware -e POSTGRES_DB=rapot_middleware \
            -e POSTGRES_PASSWORD=ci-only-password postgres:16-alpine
          for attempt in $(seq 1 30); do
            if docker exec rapot-ci-postgres pg_isready -h 127.0.0.1 -U rapot_middleware -d rapot_middleware; then break; fi
            sleep 2
          done
          docker exec rapot-ci-postgres pg_isready -h 127.0.0.1 -U rapot_middleware -d rapot_middleware
          middleware_env=(
            -e MW_APP_ENV=production -e MW_EXECUTION_MODE=DRY_RUN
            -e MW_TRADING_ENABLED=false -e MW_BINANCE_LIVE_ENABLED=false
            -e MW_WEBHOOK_AUTH_TOKEN=ci-only-webhook -e MW_ADMIN_AUTH_TOKEN=ci-only-admin
            -e MW_INVENTORY_ACCOUNT_ID=ci-simulation
            -e MW_DATABASE_URL=postgresql+psycopg://rapot_middleware:ci-only-password@rapot-ci-postgres:5432/rapot_middleware
          )
          docker run --rm --network rapot-ci "${middleware_env[@]}" \
            otonom-analiz:${{ github.sha }} python -m scripts.runtime migrate-middleware
          docker run -d --name rapot-ci-middleware --network rapot-ci "${middleware_env[@]}" \
            otonom-analiz:${{ github.sha }} python -m scripts.runtime middleware
          health_check="import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)); assert data['status']=='ok' and data['execution_mode']=='DRY_RUN' and data['trading_enabled'] is False"
          for attempt in $(seq 1 30); do
            if docker exec rapot-ci-middleware python -c "$health_check"; then break; fi
            sleep 2
          done
          docker logs rapot-ci-middleware
          docker exec rapot-ci-middleware python -c "$health_check"

      - name: Build frontend standalone image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: rapot-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
