name: Publish container images (manual server deployment)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_api_delta:
        description: Publish API source update on the pinned production runtime (unchanged dependencies only)
        type: boolean
        default: false
      publish_borsapy_runtime:
        description: Publish the separately verified additive borsapy API runtime (no server deployment)
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Publish backend and frontend images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve immutable source revision and image names
        id: source
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend image at exact source SHA
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.source.outputs.repository }}/backend:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish frontend image at exact source SHA
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.source.outputs.repository }}/frontend:${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            API_PROXY_TARGET=http://api:8000
            HEALTH_PROXY_TARGET=http://bot:5000
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Record publication status (no server deployment)
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          IMAGE_REPOSITORY: ${{ steps.source.outputs.repository }}
        shell: bash
        run: |
          {
            echo '## Images published; server deployment not performed'
            echo "Source commit: $SOURCE_SHA"
            echo "Backend: $REGISTRY/$IMAGE_REPOSITORY/backend:$SOURCE_SHA"
            echo "Frontend: $REGISTRY/$IMAGE_REPOSITORY/frontend:$SOURCE_SHA"
            echo 'Follow docs/DEPLOY.md for verified-commit checks, backups, migrations and server rollout.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-api-delta:
    name: Verify and publish API delta image
    if: github.event_name == 'workflow_dispatch' && inputs.publish_api_delta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_BASE_SOURCE: 279aa9fea99b520e661b43f104a2bf4791893ac3
      API_BASE_IMAGE: ghcr.io/rapto0/rapot/backend@sha256:9be0fdb6097f52bf97730f44c86d28c24e2c0cea1fe181e7e8fd668177fdb034
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify unchanged runtime inputs and prepare canonical source
        id: source
        shell: bash
        run: |
          git diff --exit-code "$API_BASE_SOURCE" HEAD -- \
            Dockerfile requirements.txt requirements-security.txt requirements-dev.lock .python-version
          test -z "$(git status --porcelain)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/api-delta-context" "$RUNNER_TEMP/api-delta-proof"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/api-delta-context"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          wanted = [name for name in files if name.endswith(".py") and not name.startswith(".")]
          wanted += ["Dockerfile", "Dockerfile.api-delta", ".python-version", "requirements.txt",
                     "requirements-security.txt", "requirements-dev.lock"]
          result = {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in wanted}
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "api-delta-proof/source-sha256.json"
          target.write_text(json.dumps(result, sort_keys=True), encoding="utf-8")
          PY

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image from the pinned installed runtime
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/api-delta-context
          file: ${{ runner.temp }}/api-delta-context/Dockerfile.api-delta
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/${{ steps.source.outputs.repository }}/backend:api-${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Compare installed distributions and verify the API image offline
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.source.outputs.repository }}/backend:api-${{ steps.source.outputs.sha }}
        run: |
          docker pull "$API_BASE_IMAGE"
          INVENTORY='import importlib.metadata,json; print(json.dumps(sorted((d.metadata["Name"].lower(),d.version) for d in importlib.metadata.distributions())))'
          docker run --rm --network none "$API_BASE_IMAGE" python -c "$INVENTORY" > "$RUNNER_TEMP/api-delta-proof/base-distributions.json"
          docker run --rm --network none "$API_IMAGE" python -c "$INVENTORY" > "$RUNNER_TEMP/api-delta-proof/api-distributions.json"
          cmp "$RUNNER_TEMP/api-delta-proof/base-distributions.json" "$RUNNER_TEMP/api-delta-proof/api-distributions.json"
          docker run --rm --network none "$API_IMAGE" python -m pip check
          docker run --rm -i --network none --read-only --tmpfs /tmp:rw,size=64m --workdir /tmp \
            --mount "type=bind,source=$RUNNER_TEMP/api-delta-proof/source-sha256.json,target=/source-sha256.json,readonly" \
            -e PYTHONPATH=/app -e TELEGRAM_TOKEN=ci-test-token -e TELEGRAM_CHAT_ID=ci-test-chat \
            -e APP_ENV=test -e AI_ENABLED=0 -e RUN_EMBEDDED_BOT=false -e SERVER_ALARMS_ENABLED=false \
            -e JWT_SECRET_KEY=ci-only-secret-not-used-for-real-sessions \
            -e DATABASE_PATH=/tmp/trading.sqlite3 -e CACHE_DATABASE_PATH=/tmp/cache.sqlite3 \
            -e MW_WEBHOOK_AUTH_TOKEN=ci-test-webhook \
            "$API_IMAGE" python - <<'PY'
          import hashlib, json, pathlib
          from datetime import UTC, datetime
          expected = json.loads(pathlib.Path("/source-sha256.json").read_text())
          for name, digest in expected.items():
              source = pathlib.Path("/app") / name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, name
              if name.endswith(".py"):
                  compile(source.read_bytes(), str(source), "exec")
          import ai_evaluation
          import api.main
          import middleware.api.main
          import numpy as np
          import pandas as pd
          from db_session import init_db
          from api.routes.alarm_routes import AlarmWrite
          from application.services.server_alarm_evaluator import evaluate_closed_alarm_bars
          from application.services import server_alarm_service as service
          from infrastructure.repositories import server_alarm_repository as repository
          init_db()
          write = AlarmWrite(name="CI offline", symbols=[{"symbol": "BTCUSDT", "market_type": "Kripto"}],
                             indicator="rsi", timeframe="1h", side="dip", threshold=30,
                             notify_telegram=False)
          rule = service.save_rule("ci-admin", write.model_dump())
          assert service.list_rules("ci-other") == []
          assert service.list_rules("ci-admin")[0]["id"] == rule["id"]
          axis = np.arange(161)
          close = 100 + axis / 10 + np.sin(axis / 3) * 5
          frame = pd.DataFrame({"Open": close + .2, "High": close + 2, "Low": close - 2,
                                "Close": close, "Volume": 1000. + axis},
                               index=pd.date_range(end="2026-10-02T12:00:00Z", periods=161, freq="1h"))
          frame.attrs["timeframe"] = "1h"
          for indicator, threshold in (("rsi", 30), ("wr", -80), ("combo", 3), ("hunter", 7)):
              result = evaluate_closed_alarm_bars(frame, market_type="Kripto", timeframe="1h",
                        indicator=indicator, side="dip", threshold=threshold,
                        now=datetime(2026, 10, 2, 12, 30, tzinfo=UTC))
              assert result["bar_time"] == "2026-10-02T11:00:00Z"
          service.delete_rule("ci-admin", rule["id"])
          assert service.list_rules("ci-admin") == []
          repository.prune_history()
          print(json.dumps({"status": "passed", "source_files_verified": len(expected),
                            "network": "disabled", "indicators": 4, "crud": "passed"}))
          PY
          docker image inspect "$API_IMAGE" --format '{"size_bytes":{{.Size}},"layers":{{json .RootFS.Layers}}}' > "$RUNNER_TEMP/api-delta-proof/image-layers.json"

      - name: Publish verified API image
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.source.outputs.repository }}/backend:api-${{ steps.source.outputs.sha }}
        run: |
          docker push "$API_IMAGE"
          docker image inspect "$API_IMAGE" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/api-delta-proof/published-digests.json"
          {
            echo '## API delta image published; server deployment not performed'
            echo "API image: $API_IMAGE"
            echo "Unchanged dependency base: $API_BASE_IMAGE"
            echo 'Installed distributions matched the base; source hashes, imports, SQLite CRUD and four indicators passed without network.'
            echo 'Fresh registry-layer capacity checks, anonymous pull access and a verified offhost SQLite backup are still required before server deployment.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve API delta source and runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: api-delta-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/api-delta-proof/
          if-no-files-found: error
          retention-days: 14

  publish-borsapy-runtime:
    name: Verify and publish additive borsapy runtime
    if: github.event_name == 'workflow_dispatch' && inputs.publish_borsapy_runtime
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      API_BASE_SOURCE: 279aa9fea99b520e661b43f104a2bf4791893ac3
      API_BASE_IMAGE: ghcr.io/rapto0/rapot/backend@sha256:9be0fdb6097f52bf97730f44c86d28c24e2c0cea1fe181e7e8fd668177fdb034
      BORSAPY_SOURCE_IMAGE: ghcr.io/rapto0/rapot/backend@sha256:384674f3a7230ae4a6b182ac26e6114808627555988cb3305e7ed906b7d59def
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify unchanged base inputs and prepare canonical extension source
        id: source
        shell: bash
        run: |
          git diff --exit-code "$API_BASE_SOURCE" HEAD -- Dockerfile .python-version requirements-security.txt
          test -z "$(git status --porcelain)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          mkdir "$RUNNER_TEMP/borsapy-context" "$RUNNER_TEMP/borsapy-proof"
          python -m scripts.verify_borsapy_source select --root . \
            --output "$RUNNER_TEMP/borsapy-proof/build-mode.json" --github-output "$GITHUB_OUTPUT"
          git archive --format=tar HEAD | tar -x -C "$RUNNER_TEMP/borsapy-context"
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          wanted = [name for name in files if name.endswith(".py") and not name.startswith(".")]
          wanted += ["Dockerfile", "Dockerfile.borsapy-runtime", "Dockerfile.borsapy-source", ".python-version", "requirements.txt",
                     "requirements-security.txt", "requirements-dev.lock"]
          result = {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in wanted}
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "borsapy-proof/source-sha256.json"
          target.write_text(json.dumps(result, sort_keys=True), encoding="utf-8")
          PY

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the selected image on its pinned installed runtime
        uses: docker/build-push-action@v7
        with:
          context: ${{ runner.temp }}/borsapy-context
          file: ${{ runner.temp }}/borsapy-context/${{ steps.source.outputs.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ghcr.io/${{ steps.source.outputs.repository }}/backend:borsapy-${{ steps.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Verify exact additions, unchanged installed files, pins and shared layers
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.source.outputs.repository }}/backend:borsapy-${{ steps.source.outputs.sha }}
        run: |
          docker pull "$API_BASE_IMAGE"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-context/scripts/verify_borsapy_runtime.py,target=/verifier.py,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-proof,target=/proof" \
            "$API_BASE_IMAGE" python /verifier.py capture --output /proof/base-inventory.json
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-proof,target=/proof" \
            "$API_IMAGE" python -m scripts.verify_borsapy_runtime capture --output /proof/extension-inventory.json
          docker image inspect "$API_BASE_IMAGE" --format '{"size_bytes":{{.Size}},"layers":{{json .RootFS.Layers}}}' > "$RUNNER_TEMP/borsapy-proof/base-layers.json"
          docker image inspect "$API_IMAGE" --format '{"size_bytes":{{.Size}},"layers":{{json .RootFS.Layers}},"labels":{{json .Config.Labels}}}' > "$RUNNER_TEMP/borsapy-proof/extension-layers.json"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-proof,target=/proof" \
            "$API_IMAGE" python -m scripts.verify_borsapy_runtime verify \
            --before /proof/base-inventory.json --after /proof/extension-inventory.json --root /app \
            --base-layers /proof/base-layers.json --extension-layers /proof/extension-layers.json \
            --output /proof/runtime-verification.json

      - name: Verify all accepted Borsapy runtime files and layers in source-only mode
        if: steps.source.outputs.mode == 'source-only'
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.source.outputs.repository }}/backend:borsapy-${{ steps.source.outputs.sha }}
        run: |
          docker pull "$BORSAPY_SOURCE_IMAGE"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-context/scripts/verify_borsapy_runtime.py,target=/verifier.py,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-proof,target=/proof" \
            "$BORSAPY_SOURCE_IMAGE" python /verifier.py capture --output /proof/source-base-inventory.json
          docker image inspect "$BORSAPY_SOURCE_IMAGE" --format '{"size_bytes":{{.Size}},"layers":{{json .RootFS.Layers}},"labels":{{json .Config.Labels}}}' > "$RUNNER_TEMP/borsapy-proof/source-base-layers.json"
          docker run --rm --network none --read-only --tmpfs /tmp:rw,size=64m \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-proof,target=/proof" \
            "$API_IMAGE" python -m scripts.verify_borsapy_source verify \
            --before /proof/source-base-inventory.json --after /proof/extension-inventory.json \
            --base-layers /proof/source-base-layers.json --image-layers /proof/extension-layers.json \
            --output /proof/source-only-verification.json

      - name: Verify image sources, imports, crypto, SQLite and indicators without network
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.source.outputs.repository }}/backend:borsapy-${{ steps.source.outputs.sha }}
        run: |
          docker run --rm -i --network none --read-only --tmpfs /tmp:rw,size=96m --workdir /tmp \
            --mount "type=bind,source=$RUNNER_TEMP/borsapy-proof,target=/proof" \
            -e PYTHONPATH=/app -e TELEGRAM_TOKEN=ci-test-token -e TELEGRAM_CHAT_ID=ci-test-chat \
            -e APP_ENV=test -e AI_ENABLED=0 -e RUN_EMBEDDED_BOT=false -e SERVER_ALARMS_ENABLED=false \
            -e BORSAPY_ENABLED=false -e JWT_SECRET_KEY=ci-only-secret-not-used-for-real-sessions \
            -e DATABASE_PATH=/tmp/trading.sqlite3 -e CACHE_DATABASE_PATH=/tmp/cache.sqlite3 \
            -e MW_WEBHOOK_AUTH_TOKEN=ci-test-webhook \
            "$API_IMAGE" python - <<'PY'
          import hashlib, json, pathlib
          from datetime import UTC, datetime
          expected = json.loads(pathlib.Path("/proof/source-sha256.json").read_text())
          for name, digest in expected.items():
              source = pathlib.Path("/app") / name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == digest, name
              if name.endswith(".py"):
                  compile(source.read_bytes(), str(source), "exec")
          import borsapy as bp
          import cryptography.fernet
          import openai, pymupdf, pymupdf4llm, onnxruntime, Scweet
          import ai_evaluation, api.main, middleware.api.main
          import numpy as np
          import pandas as pd
          from db_session import init_db
          from infrastructure.repositories.borsapy_secret_store import BorsapySecretStore
          from application.services.borsapy_research import run_operation
          from application.services.server_alarm_evaluator import evaluate_closed_alarm_bars
          init_db()
          store = BorsapySecretStore(pathlib.Path("/tmp/credentials-test/store.enc"), "x" * 48)
          store.save({"test": "synthetic-only"})
          assert store.load() == {"test": "synthetic-only"}
          assert b"synthetic-only" not in store.path.read_bytes()
          store.clear()
          axis = np.arange(161)
          close = 100 + axis / 10 + np.sin(axis / 3) * 5
          frame = pd.DataFrame({"Open": close + .2, "High": close + 2, "Low": close - 2,
                                "Close": close, "Volume": 1000. + axis},
                               index=pd.date_range(end="2026-10-02T12:00:00Z", periods=161, freq="1h"))
          original_ticker = bp.Ticker
          class FixtureTicker:
              def __init__(self, symbol):
                  self.symbol = symbol
              def history(self, **kwargs):
                  return frame.copy()
          try:
              bp.Ticker = FixtureTicker
              for operation in ("history", "replay", "heikin_ashi", "ta.indicators"):
                  result = run_operation(bp, operation, {})
                  assert len(result["candles"]) == 161
                  json.dumps(result, allow_nan=False)
          finally:
              bp.Ticker = original_ticker
          frame.attrs["timeframe"] = "1h"
          for indicator, threshold in (("rsi", 30), ("wr", -80), ("combo", 3), ("hunter", 7)):
              result = evaluate_closed_alarm_bars(frame, market_type="Kripto", timeframe="1h",
                        indicator=indicator, side="dip", threshold=threshold,
                        now=datetime(2026, 10, 2, 12, 30, tzinfo=UTC))
              assert result["bar_time"] == "2026-10-02T11:00:00Z"
          proof = {"status": "passed", "network": "disabled", "source_files_verified": len(expected),
                   "new_native_imports": "passed", "encrypted_store_roundtrip": "passed",
                   "sqlite_initialization": "passed", "research_operations": 4, "native_indicators": 4}
          pathlib.Path("/proof/offline-smoke.json").write_text(json.dumps(proof, sort_keys=True))
          print(json.dumps(proof))
          PY

      - name: Publish verified Borsapy API image
        shell: bash
        env:
          API_IMAGE: ghcr.io/${{ steps.source.outputs.repository }}/backend:borsapy-${{ steps.source.outputs.sha }}
          BUILD_MODE: ${{ steps.source.outputs.mode }}
          DIRECT_BASE_IMAGE: ${{ steps.source.outputs.direct_base_image }}
        run: |
          docker push "$API_IMAGE"
          docker image inspect "$API_IMAGE" --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/borsapy-proof/published-digests.json"
          docker buildx imagetools inspect "$API_IMAGE" --raw > "$RUNNER_TEMP/borsapy-proof/registry-manifest.json"
          {
            echo '## Borsapy API image published; server deployment not performed'
            echo "API image: $API_IMAGE"
            echo "Build mode: $BUILD_MODE"
            echo "Direct base image: $DIRECT_BASE_IMAGE"
            echo "Preserved runtime base: $API_BASE_IMAGE"
            echo 'Existing distribution versions and file hashes are unchanged; exactly 22 reviewed additions match the lock.'
            echo 'All base layers are reused. Offline imports, encryption, SQLite and indicator checks passed.'
            if [ "$BUILD_MODE" = source-only ]; then
              echo 'Source-only proof also matched every installed file across all 120 distributions and the complete accepted Borsapy layer prefix.'
            fi
            echo 'Registry layer sizes, live capacity including the fixed reserve, and a verified offhost backup remain deployment gates.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve additive runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: borsapy-runtime-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/borsapy-proof/
          if-no-files-found: error
          retention-days: 14
